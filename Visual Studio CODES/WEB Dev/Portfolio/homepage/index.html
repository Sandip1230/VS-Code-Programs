<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-9">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Font -->
  <link href= "https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Dark overlay -->
  <div class="overlay"></div>

  <div class="content">
    <!-- Stylish Animated S -->
    <div class="s-logo">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradient for glossy green -->
          <linearGradient id="greenGloss" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ff9d"/>
            <stop offset="50%" stop-color="#00cc66"/>
            <stop offset="100%" stop-color="#00994d"/>
          </linearGradient>
          
          <!-- Glow filter -->
          <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation ="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        
        <!-- Futuristic S Path -->
        <path d="M 220 50
                 Q 120 30, 100 90
                 Q 80 140, 180 150
                 Q 260 160, 200 220
                 Q 140 280, 60 250"
              fill="none"
              stroke="url(#greenGloss)"
              stroke-width="28"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#greenGlow)">
        </path>
      </svg>
    </div>

    <!-- Title + Button -->
    <h1>Welcome to My Website</h1>
    <a href="http://127.0.0.1:5500/mainpage/mainpage.html" class="btn">Come with me</a>
  </div>
</body>
</html>
